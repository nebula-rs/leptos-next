$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Projetos do monorepo — ver docs/guide/monorepo.md
projects:
  docs: 'docs'
  leptos-nebula: 'apps/leptos-nebula'
  leptos-press: 'apps/leptos-press'
  docs-app: 'apps/docs'

vcs:
  client: 'git'
  defaultBranch: 'main'

hasher:
  walkStrategy: 'vcs'
