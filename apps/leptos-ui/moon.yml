$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.toml'
    - '/Cargo.toml'

tasks:
  check:
    command: 'cargo check -p leptos-ui --all-targets'
    inputs: ['@group(sources)']

  check-wasm:
    command: 'cargo check -p leptos-ui --target wasm32-unknown-unknown'
    inputs: ['@group(sources)']

  # Componentes precisam renderizar no servidor (SSG do leptos-press) — ADR-0007
  check-ssr:
    command: 'cargo check -p leptos-ui --features ssr'
    inputs: ['@group(sources)']

  lint:
    command: 'cargo clippy -p leptos-ui --all-targets -- -D warnings'
    inputs: ['@group(sources)']

  lint-wasm:
    command: 'cargo clippy -p leptos-ui --target wasm32-unknown-unknown -- -D warnings'
    inputs: ['@group(sources)']

  fmt:
    command: 'cargo fmt -p leptos-ui --check'
    inputs: ['@group(sources)']

  test:
    command: 'cargo test -p leptos-ui'
    inputs: ['@group(sources)']
